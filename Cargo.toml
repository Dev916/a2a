[package]
name = "a2a"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.29", features = ["process", "fs", "signal"] }
rand = "0.8"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "process", "net", "io-util", "sync", "time", "signal", "macros"] }
# `rt` is what TaskTracker needs; tokio-util's default feature set is empty.
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2.2.2"
# Fake-fidelity validation only (spec §8.3). Default features would drag in
# reqwest + a TLS stack to resolve remote $refs; the snapshots are self-contained.
jsonschema = { version = "0.49.9", default-features = false }
predicates = "3.1.4"
tempfile = "3.27.0"
