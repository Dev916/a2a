[package]
name = "a2a"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
# `socket` is what the broker's peer-uid check needs (LOCAL_PEERCRED on
# macOS, SO_PEERCRED on linux) and `user` is `getuid`, which is the other half
# of that comparison; the version prefix stays literal for the toolchain pin in
# tests/cli_contract.rs.
nix = { version = "0.29", features = ["process", "fs", "signal", "socket", "user"] }
rand = "0.8"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "process", "net", "io-util", "sync", "time", "signal", "macros"] }
# `rt` is what TaskTracker needs; tokio-util's default feature set is empty.
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1.4"
# Comment-preserving TOML mutation for `a2a sync mcp`: the destination is
# somebody's hand-written `~/.codex/config.toml`, and a writer that re-serialized
# it would silently delete their comments and grouping. `toml` 1.1.4 does NOT
# re-export this — it is its own crate.
toml_edit = "0.25"
ed25519-dalek = "2"
rcgen = "0.10.0"
ulid = "1"

[dev-dependencies]
assert_cmd = "2.2.2"
# Fake-fidelity validation only (spec §8.3). Default features would drag in
# reqwest + a TLS stack to resolve remote $refs; the snapshots are self-contained.
jsonschema = { version = "0.49.9", default-features = false }
predicates = "3.1.4"
tempfile = "3.27.0"
# `test-util` is what makes `tokio::time::pause` available, and it is dev-only
# on purpose: the backoff/probe SCHEDULING tests must be able to elapse a
# 60-second window in microseconds, and a paused clock must never be reachable
# from the shipped daemon.
tokio = { version = "1", features = ["test-util"] }
